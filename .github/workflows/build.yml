name: Build IPA

# 说明：
# - GitHub 免费账户无法使用 macOS runner，因此本工作流默认只做 Linux 侧静态检查。
# - 若你的账户有 macOS 额度（团队/付费计划），把下面 build-ipa 任务的 if 条件改为 true 即可。
# - 没有 macOS 时，请参考 README 里的「其它出包方式」。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1) 轻量静态检查：所有平台都能跑，用来尽早发现语法/结构问题
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Swift file structure
        run: |
          set -e
          echo "== Swift 文件清单 =="
          find RepoStore -name "*.swift" | sort
          echo
          echo "== 括号配平检查 =="
          fail=0
          for f in $(find RepoStore -name "*.swift"); do
            o=$(tr -cd '{' < "$f" | wc -c)
            c=$(tr -cd '}' < "$f" | wc -c)
            if [ "$o" != "$c" ]; then
              echo "MISMATCH $f: {=$o }=$c"; fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "全部配平 OK"

      - name: Validate JSON example
        run: |
          if [ -f example-repo.json ]; then
            python3 -m json.tool example-repo.json > /dev/null && echo "example-repo.json OK"
          fi

      - name: Validate project.yml
        run: |
          python3 -c "import yaml,sys; yaml.safe_load(open('project.yml'))" && echo "project.yml OK" || \
          echo "PyYAML 未安装，跳过（可忽略）"

  # 2) 真正的 IPA 构建（需要 macOS runner）
  build-ipa:
    needs: lint
    if: false   # 免费账户无 macOS 额度；有额度时改为 true，或改成 vars.ENABLE_MACOS_BUILD == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project RepoStore.xcodeproj \
            -scheme RepoStore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          ldid -S "Payload/$(basename "$APP")/$(basename "$APP" .app)" || true
          zip -r -q RepoStore.ipa Payload
          ls -lh RepoStore.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: RepoStore-ipa
          path: RepoStore.ipa
