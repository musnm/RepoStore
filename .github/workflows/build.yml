name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen and ldid
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RepoStore.xcodeproj \
            -scheme RepoStore \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA (TrollStore ready)
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ldid -S "Payload/$(basename "$APP_PATH")/$(basename "$APP_PATH" .app)" || true
          zip -r -q RepoStore.ipa Payload
          ls -lh RepoStore.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RepoStore-ipa
          path: RepoStore.ipa
          retention-days: 30
