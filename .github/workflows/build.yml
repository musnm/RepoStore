name: Build IPA

# 说明：
# - 本项目主实现为 Objective-C（objc/ 目录），由 objc/build.sh 用 Theos 工具链交叉编译。
# - GitHub 免费账户无法使用 macOS runner，因此默认只做 Linux 侧结构检查。
# - 若账户有 macOS 额度，可把 build-ipa 的 if 改为 true。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1) 静态检查：Objective-C 源码结构
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 源文件清单
        run: |
          echo "== Objective-C 源文件 =="
          find objc/RS -name "*.m" -o -name "*.h" | sort

      - name: 括号配平检查
        run: |
          set -e
          fail=0
          for f in $(find objc/RS -name "*.m" -o -name "*.h"); do
            o=$(tr -cd '{' < "$f" | wc -c)
            c=$(tr -cd '}' < "$f" | wc -c)
            if [ "$o" != "$c" ]; then
              echo "MISMATCH $f: {=$o }=$c"; fail=1
            fi
            o2=$(tr -cd '(' < "$f" | wc -c)
            c2=$(tr -cd ')' < "$f" | wc -c)
            if [ "$o2" != "$c2" ]; then
              echo "PAREN MISMATCH $f: (=$o2 )=$c2"; fail=1
            fi
          done
          [ $fail -eq 0 ] && echo "全部配平 OK" || exit 1

      - name: 关键文件存在性
        run: |
          set -e
          for f in \
            objc/build.sh \
            objc/ent_ts.plist \
            objc/RS/RSAppDelegate.m \
            objc/RS/Services/RSStore.m \
            objc/RS/Views/RSRepoListViewController.m \
            objc/RS/Views/RSPopMenuView.m
          do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "关键文件齐全"

      - name: 校验示例源 JSON
        run: |
          if [ -f example-repo.json ]; then
            python3 -m json.tool example-repo.json > /dev/null && echo "example-repo.json OK"
          fi

  # 2) 真机构建（需 macOS runner + 自备 RSEsignKey.h）
  build-ipa:
    needs: lint
    if: false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          echo "需自备 objc/RS/Models/RSEsignKey.h 后启用"
          chmod +x objc/build.sh
